<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de adoção de gatos</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header></header>
    <main>

        <h1>Escolha um gato para adotar.</h1>

        <section class="banner">
            <img src="assets/img/gato-tigrado-Photoroom (1).png" alt="Gato tigrado">
            <p class="texto-foco">Olha os gatos ai que legal 😁👍.</p>
            <p class="texto-secundario">Leve um pedaço de amor para sua casa.</p>
        </section>

        <section class="container" id="card-container">

            <div class="card">

                <h3>Gato dark</h3>
                <img src="assets/img/gato-dark.webp" alt="">
                <button>Adotar Gato</button>

            </div>
            <div class="card">

                <h3>Gato cotoco</h3>
                <img src="assets/img/gato-cotoco.jfif" alt="">
                <button>Adotar Gato</button>

            </div>
            <div class="card">

                <h3>Gato pelado</h3>
                <img src="assets/img/gato-pelado.jpg" alt="">
                <button>Adotar Gato</button>

            </div>

        </section>
    </main>

    <footer id="rodape">feito por Davi Bonifacio todos os Direitos reservados &reg;</footer>
</body>

</html>
